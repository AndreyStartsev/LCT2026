<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Инспектор ИИ">
  <title>Инспектор ИИ</title>
  <!-- Знак приложения из рельсы экрана (Rail.tsx, Mark), пересобранный под вкладку: на 16
       пикселях рамка листа съедала место, поэтому осталось главное — контур здания и лупа.
       Подложка своя, чтобы знак читался и на светлой вкладке, и на тёмной; цвета нет, на
       этом экране он значит только решение инспектора. -->
  <rect width="32" height="32" fill="#f8f8f6"/>
  <path d="M4 26.6 L12.6 6.6 L21.2 26.6" fill="none" stroke="#17181a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M8 20 H17.2" stroke="#17181a" stroke-width="2.4"/>
  <circle cx="23" cy="11" r="5.8" fill="#f8f8f6" stroke="#17181a" stroke-width="3"/>
  <path d="M27 15 L29.2 17.2" stroke="#17181a" stroke-width="3.2" stroke-linecap="round"/>
</svg>
