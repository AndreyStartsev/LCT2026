<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Архитектура: web, api, RabbitMQ, worker, хранилища, модель чтения, ИАИС «РиН»">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#C4004A"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8A83D1"/>
    </marker>
  </defs>

  <rect width="1280" height="520" rx="24" fill="#F8F8FA"/>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="23.5" fill="none" stroke="#E4E3EC"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- контур docker compose -->
    <rect x="272" y="44" width="776" height="444" rx="18" fill="none" stroke="#C9C4F0" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text x="292" y="72" fill="#8A83D1" font-size="13" font-weight="700" letter-spacing="1.6">DOCKER COMPOSE</text>

    <!-- связи -->
    <g fill="none" stroke="#C4004A" stroke-width="2">
      <path d="M232 138H296" marker-end="url(#a)"/>
      <path d="M232 288H296" marker-end="url(#a)"/>
      <path d="M395 178V246" marker-end="url(#a)"/>
      <path d="M492 288H556" marker-end="url(#a)"/>
      <path d="M774 288H826" marker-end="url(#a)"/>
      <path d="M492 268H522V138H1072" marker-end="url(#a)"/>
    </g>
    <g fill="none" stroke="#8A83D1" stroke-width="2">
      <path d="M395 328V382"/>
      <path d="M920 328V382"/>
      <path d="M1028 288H1072" stroke-dasharray="6 5" marker-end="url(#ad)"/>
    </g>
    <text x="405" y="218" fill="#5F616D" font-size="13">REST</text>
    <text x="797" y="128" fill="#5F616D" font-size="13" text-anchor="middle">финализированный протокол</text>

    <!-- кто работает -->
    <g transform="translate(40 100)">
      <rect width="192" height="76" rx="14" fill="#FFFFFF" stroke="#C4004A" stroke-width="1.6"/>
      <g transform="translate(16 22)" fill="none" stroke="#C4004A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="2" width="32" height="26" rx="4"/>
        <path d="M0 10h32M6 6h.01M11 6h.01"/>
      </g>
      <text x="62" y="35" fill="#1C1D22" font-size="17" font-weight="700">Инспектор</text>
      <text x="62" y="55" fill="#5F616D" font-size="13">браузер</text>
    </g>
    <g transform="translate(40 250)">
      <rect width="192" height="76" rx="14" fill="#FFFFFF" stroke="#C4004A" stroke-width="1.6"/>
      <g transform="translate(16 22)" fill="none" stroke="#C4004A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="2" width="32" height="26" rx="4"/>
        <path d="M7 11l5 4-5 4M16 20h8"/>
      </g>
      <text x="62" y="35" fill="#1C1D22" font-size="17" font-weight="700">Загрузчик</text>
      <text x="62" y="55" fill="#5F616D" font-size="13">папка объекта</text>
    </g>

    <!-- сервисы -->
    <g transform="translate(300 100)">
      <rect width="192" height="78" rx="14" fill="#520977"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="18" font-weight="700">web</text>
      <text x="20" y="56" fill="#E4DDF3" font-size="13">React · nginx</text>
    </g>
    <g transform="translate(300 250)">
      <rect width="192" height="78" rx="14" fill="#520977"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="18" font-weight="700">api</text>
      <text x="20" y="56" fill="#E4DDF3" font-size="13">Node.js · Fastify · JWT</text>
    </g>
    <g transform="translate(560 250)">
      <rect width="212" height="78" rx="14" fill="#FFFFFF" stroke="#520977" stroke-width="1.8"/>
      <text x="20" y="34" fill="#1C1D22" font-size="18" font-weight="700">RabbitMQ</text>
      <text x="20" y="56" fill="#5F616D" font-size="13">разбор → сверка → протокол</text>
    </g>
    <g transform="translate(830 250)">
      <rect width="196" height="78" rx="14" fill="#520977"/>
      <text x="20" y="34" fill="#FFFFFF" font-size="18" font-weight="700">worker</text>
      <text x="20" y="56" fill="#E4DDF3" font-size="13">Python · Tesseract</text>
    </g>

    <!-- хранилища -->
    <g transform="translate(300 382)">
      <rect width="722" height="86" rx="14" fill="#FFFFFF" stroke="#E4E3EC"/>
      <g transform="translate(26 20)">
        <path d="M0 6c0-4 26-4 26 0v34c0 4-26 4-26 0Z" fill="#F3EEFA" stroke="#520977" stroke-width="1.8"/>
        <ellipse cx="13" cy="6" rx="13" ry="4" fill="#FFFFFF" stroke="#520977" stroke-width="1.8"/>
        <text x="40" y="20" fill="#1C1D22" font-size="16" font-weight="700">PostgreSQL</text>
        <text x="40" y="39" fill="#5F616D" font-size="13">протоколы, решения, аудит</text>
      </g>
      <g transform="translate(276 20)">
        <path d="M0 6c0-4 26-4 26 0v34c0 4-26 4-26 0Z" fill="#F3EEFA" stroke="#520977" stroke-width="1.8"/>
        <ellipse cx="13" cy="6" rx="13" ry="4" fill="#FFFFFF" stroke="#520977" stroke-width="1.8"/>
        <text x="40" y="20" fill="#1C1D22" font-size="16" font-weight="700">MinIO</text>
        <text x="40" y="39" fill="#5F616D" font-size="13">исходные файлы</text>
      </g>
      <g transform="translate(508 20)">
        <path d="M0 6c0-4 26-4 26 0v34c0 4-26 4-26 0Z" fill="#F3EEFA" stroke="#520977" stroke-width="1.8"/>
        <ellipse cx="13" cy="6" rx="13" ry="4" fill="#FFFFFF" stroke="#520977" stroke-width="1.8"/>
        <text x="40" y="20" fill="#1C1D22" font-size="16" font-weight="700">Redis</text>
        <text x="40" y="39" fill="#5F616D" font-size="13">ход обработки</text>
      </g>
    </g>

    <!-- снаружи -->
    <g transform="translate(1076 100)">
      <rect width="170" height="78" rx="14" fill="#FFFFFF" stroke="#C4004A" stroke-width="1.6"/>
      <text x="18" y="34" fill="#1C1D22" font-size="17" font-weight="700">ИАИС «РиН»</text>
      <text x="18" y="56" fill="#5F616D" font-size="13">приём протоколов</text>
    </g>
    <g transform="translate(1076 250)">
      <rect width="170" height="78" rx="14" fill="#FFFFFF" stroke="#8A83D1" stroke-width="1.6" stroke-dasharray="6 4"/>
      <text x="18" y="30" fill="#1C1D22" font-size="17" font-weight="700">Модель чтения</text>
      <text x="18" y="50" fill="#5F616D" font-size="13">сканы и чертежи</text>
      <text x="18" y="66" fill="#5F616D" font-size="13">llm или свой сервер</text>
    </g>
  </g>
</svg>
