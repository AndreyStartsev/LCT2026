<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 352" width="1280" height="352" role="img" aria-label="Как работает проверка: загрузка, реестр, чтение, сверка, протокол, решение инспектора">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#520977"/>
      <stop offset="1" stop-color="#C4004A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A83D1"/>
      <stop offset="0.55" stop-color="#FF0053"/>
      <stop offset="1" stop-color="#FC3777"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="352" rx="24" fill="#F8F8FA"/>
  <rect x="0.5" y="0.5" width="1279" height="351" rx="23.5" fill="none" stroke="#E4E3EC"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- стрелки между шагами -->
    <g fill="#FF0053">
      <path d="M227 168l10 8-10 8z"/>
      <path d="M431 168l10 8-10 8z"/>
      <path d="M635 168l10 8-10 8z"/>
      <path d="M839 168l10 8-10 8z"/>
      <path d="M1043 168l10 8-10 8z"/>
    </g>

    <!-- 1. Загрузка -->
    <g transform="translate(42 36)">
      <rect width="176" height="280" rx="16" fill="#FFFFFF" stroke="#E4E3EC"/>
      <circle cx="30" cy="30" r="15" fill="#520977"/>
      <text x="30" y="35.5" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">1</text>
      <g transform="translate(64 62)" fill="none" stroke="#520977" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14h13l5 5h22v21a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z"/>
        <path d="M24 37V25M18.5 30.5L24 25l5.5 5.5"/>
      </g>
      <text x="88" y="148" fill="#1C1D22" font-size="19" font-weight="700" text-anchor="middle">Загрузка</text>
      <g fill="#5F616D" font-size="14" text-anchor="middle">
        <text x="88" y="180">Папка объекта:</text>
        <text x="88" y="200">ПД, РД и ИД</text>
        <text x="88" y="220">PDF, DOCX, XML</text>
      </g>
    </g>

    <!-- 2. Реестр -->
    <g transform="translate(246 36)">
      <rect width="176" height="280" rx="16" fill="#FFFFFF" stroke="#E4E3EC"/>
      <circle cx="30" cy="30" r="15" fill="#520977"/>
      <text x="30" y="35.5" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">2</text>
      <g transform="translate(64 62)" fill="none" stroke="#520977" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="4" width="28" height="36" rx="3"/>
        <path d="M8 10v30a4 4 0 0 0 4 4h22"/>
        <path d="M19 14h14M19 22h14M19 30h9"/>
      </g>
      <text x="88" y="148" fill="#1C1D22" font-size="19" font-weight="700" text-anchor="middle">Реестр</text>
      <g fill="#5F616D" font-size="14" text-anchor="middle">
        <text x="88" y="180">Стадии, разделы,</text>
        <text x="88" y="200">шифры листов,</text>
        <text x="88" y="220">цепочки редакций</text>
      </g>
    </g>

    <!-- 3. Чтение -->
    <g transform="translate(450 36)">
      <rect width="176" height="280" rx="16" fill="#FFFFFF" stroke="#E4E3EC"/>
      <circle cx="30" cy="30" r="15" fill="#520977"/>
      <text x="30" y="35.5" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">3</text>
      <g transform="translate(64 62)" fill="none" stroke="#520977" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 4H9a3 3 0 0 0-3 3v32a3 3 0 0 0 3 3h14"/>
        <path d="M13 13h14M13 20h10"/>
        <circle cx="31" cy="30" r="8"/>
        <path d="M37 36l6 6"/>
      </g>
      <text x="88" y="148" fill="#1C1D22" font-size="19" font-weight="700" text-anchor="middle">Чтение</text>
      <g fill="#5F616D" font-size="14" text-anchor="middle">
        <text x="88" y="180">Текстовый слой</text>
        <text x="88" y="200">и распознавание,</text>
        <text x="88" y="220">модель — только</text>
        <text x="88" y="240">на чертежах</text>
        <text x="88" y="260">и сканах</text>
      </g>
    </g>

    <!-- 4. Сверка -->
    <g transform="translate(654 36)">
      <rect width="176" height="280" rx="16" fill="#FFFFFF" stroke="#E4E3EC"/>
      <circle cx="30" cy="30" r="15" fill="#520977"/>
      <text x="30" y="35.5" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">4</text>
      <g transform="translate(64 62)" fill="none" stroke="#520977" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="15" height="34" rx="2.5"/>
        <rect x="30" y="6" width="15" height="34" rx="2.5"/>
        <path d="M21 18h6M24.5 14.5L28 18l-3.5 3.5"/>
        <path d="M27 29h-6M23.5 25.5L20 29l3.5 3.5"/>
      </g>
      <text x="88" y="148" fill="#1C1D22" font-size="19" font-weight="700" text-anchor="middle">Сверка</text>
      <g fill="#5F616D" font-size="14" text-anchor="middle">
        <text x="88" y="180">132 параметра</text>
        <text x="88" y="200">Матрицы контроля,</text>
        <text x="88" y="220">помещения ПД и РД,</text>
        <text x="88" y="240">связи документов</text>
      </g>
    </g>

    <!-- 5. Протокол -->
    <g transform="translate(858 36)">
      <rect width="176" height="280" rx="16" fill="#FFFFFF" stroke="#E4E3EC"/>
      <circle cx="30" cy="30" r="15" fill="#520977"/>
      <text x="30" y="35.5" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">5</text>
      <g transform="translate(64 62)" fill="none" stroke="#520977" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="3" width="32" height="40" rx="3"/>
        <path d="M14 14l2.5 2.5L21 12M25 14h9"/>
        <path d="M14 25l2.5 2.5L21 23M25 25h9"/>
        <path d="M14 35h20"/>
      </g>
      <text x="88" y="148" fill="#1C1D22" font-size="19" font-weight="700" text-anchor="middle">Протокол</text>
      <g fill="#5F616D" font-size="14" text-anchor="middle">
        <text x="88" y="180">Кандидаты</text>
        <text x="88" y="200">в нарушения</text>
        <text x="88" y="220">с доказательствами:</text>
        <text x="88" y="240">файл, лист, зона</text>
      </g>
    </g>

    <!-- 6. Решение инспектора -->
    <g transform="translate(1062 36)">
      <rect width="176" height="280" rx="16" fill="url(#hl)"/>
      <circle cx="30" cy="30" r="15" fill="#FFFFFF"/>
      <text x="30" y="35.5" fill="#520977" font-size="15" font-weight="700" text-anchor="middle">6</text>
      <g transform="translate(64 62)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="14" r="8"/>
        <path d="M5 42c0-9 6.5-15 15-15 4 0 7.5 1.3 10 3.6"/>
        <circle cx="36" cy="35" r="8"/>
        <path d="M32.5 35l2.5 2.5 4.5-4.5"/>
      </g>
      <text x="88" y="148" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Инспектор</text>
      <g fill="#FFE3EE" font-size="14" text-anchor="middle">
        <text x="88" y="180">Подтвердить,</text>
        <text x="88" y="200">отклонить</text>
        <text x="88" y="220">или уточнить.</text>
        <text x="88" y="248" fill="#FFFFFF" font-weight="700">Финализация</text>
        <text x="88" y="268" fill="#FFFFFF" font-weight="700">→ ИАИС «РиН»</text>
      </g>
    </g>
  </g>
</svg>
